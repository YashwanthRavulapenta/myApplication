<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skills Carousel</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
}

.skills-section{
    width:100%;
    display:flex;
    justify-content:space-evenly;
    align-items:center;
    flex-wrap:wrap;
    padding:50px;
}

.skills-info{
    width:400px;
}

.skills-info h1{
    color:#40a4df;
    font-size:45px;
    margin-bottom:20px;
}

.skills-info p{
    color:rgb(180,180,180);
    line-height:1.8;
    font-size:18px;
}

    .mySwiper{
        width:400px;
        height: 170px;
        overflow:hidden;
        border: 1px solid springgreen;
    }

    .swiper-slide{
        display:flex;
        justify-content:center;
        align-items:center;
        transition:0.5s;
    }

    .swiper-slide img{
        width:70px;
        height:70px;
        object-fit:contain;
        transition:0.5s;
    }

    .swiper-slide-prev img,
    .swiper-slide-next img{
        opacity:0.3;
        transform:scale(1);
    }

    .swiper-slide-active img{
        opacity:1;
        width: 90px;
        height: 90px;
        transform:scale(1.5);
    }

    @media(max-width:900px){

        .skills-section{
            flex-direction:column;
            row-gap:50px;
        }

        .skills-info{
            width:90%;
            text-align:center;
        }

        .mySwiper{
            width:90%;
            height: 30%;
        }

    }

</style>
</head>
<body>

<section class="skills-section">

    <div class="skills-info">
        <h1>Programming Languages</h1>

        <p>
            Skilled in Java, Python, C++, JavaScript and SQL.
            Passionate about building scalable applications,
            solving DSA problems and developing innovative projects.
        </p>
    </div>

    <div class="swiper mySwiper">

        <div class="swiper-wrapper">

            <div class="swiper-slide">
                <img src="./skillsImages/cpp_image.svg" alt="">
            </div>

            <div class="swiper-slide">
                <img src="./skillsImages/mysql_image.png" alt="">
            </div>

            <div class="swiper-slide">
                <img src="./skillsImages/javascript_image.png" alt="">
            </div>

            <div class="swiper-slide">
                <img src="./skillsImages/cpp_image.svg" alt="">
            </div>

            <div class="swiper-slide">
                <img src="./skillsImages/javascript_image.png" alt="">
            </div>

        </div>

    </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>

const swiper = new Swiper(".mySwiper",{

    effect:"coverflow",

    centeredSlides:true,

    slidesPerView:3,

    loop:true,

    autoplay:{
        delay:2500,
        disableOnInteraction:false
    },

    coverflowEffect:{
        rotate:20,
        stretch:0,
        depth:150,
        modifier:1,
        slideShadows:false,
        scale:0.8
    }

});

</script>

</body>
</html>
